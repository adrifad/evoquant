# Initial trading configuration — spec §3
exchange: okx
environment: demo   # spec §44: anything else aborts startup

instrument:
  id: BTC-USDT-SWAP      # primary/anchor instrument (dashboard default)
  type: SWAP

instruments:
  watchlist:             # bot scans ALL of these each 15m candle (futures SWAP)
    - BTC-USDT-SWAP
    - ETH-USDT-SWAP
    - SOL-USDT-SWAP
    - XRP-USDT-SWAP
    - BNB-USDT-SWAP
    - DOGE-USDT-SWAP
    - ADA-USDT-SWAP

# Core instruments are always monitored. Dynamic names are a deterministic
# once-daily discovery universe; a trend score is never an entry instruction.
dynamic_watchlist:
  enabled: true
  dynamic_slots: 8
  max_total_symbols: 15
  refresh_hour_utc: 0
  refresh_minute_utc: 15
  filters:
    min_listing_age_days: 7
    max_spread_pct: 0.15
    # Estimated 24h USDT turnover = last price × OKX SWAP volCcy24h.
    min_liquidity_usdt: 1000000
    candidate_analysis_limit: 30
    min_trend_score: 60

timeframe: 15m

account:
  margin_mode: isolated
  position_mode: long_short_mode

leverage:
  default: 5      # user request 2026-10-02 (spec §3 hard_max = 5)
  hard_max: 5

decision:
  minimum_confidence: 0.55   # calibrated confidence (spec §33; lowered for V1 demo learning phase)

# Position sizing mode (spec §24):
#   risk_based        = size from stop distance; loss at stop = risk_per_trade_pct
#   percent_of_equity = position notional = position_pct % of equity
#                       (modal $100, position_pct 1 → posisi $1 per trade)
sizing:
  mode: percent_of_equity
  position_pct: 55.0   # notional ≈ $55 / lev 5 = MARGIN ≥ $10 per position even on coarse
                       # lot floors like BTC (50% truncated to $43 notional → $8.66 margin)

position_management:
  sl_plus:
    enabled: true
    activation_r: 1.0
    lock_in_r: 0.05
    min_profit_buffer_pct: 0.12

scalp:
  enabled: true            # 5m hybrid scalp engine (LLM supervisor+gate, fail-closed)
  base_tf: 1m
  signal_tf: 5m
  position_pct: 20         # scalp notional ~$20/position (smaller than 15m swing $55)
  max_daily_trades: 20
  llm_gate: true

# Strategy selection is independent of the baseline safety overlay.
strategy_core:
  version: 2
  enabled_families:
    - TREND_FOLLOWING
    - BREAKOUT
    - MEAN_REVERSION

validation:
  baseline_mode: false
